name: Atualizar dados

on:
  schedule:
    # Todo sábado às 08:37 de Brasília (11:37 UTC); o passo "Segundo sábado?" deixa passar só os dias 8 a 14.
    - cron: '37 11 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Segundo sábado?
        id: dia
        run: |
          d=$(TZ=America/Sao_Paulo date +%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$d" -ge 8 ] && [ "$d" -le 14 ]; }; then
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
          else
            echo "Dia $d: não é o segundo sábado do mês. Nada a fazer."
            echo "rodar=nao" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.dia.outputs.rodar == 'sim'

      - uses: actions/setup-python@v5
        if: steps.dia.outputs.rodar == 'sim'
        with:
          python-version: '3.12'

      - name: Baixar dados da CVM e cotações e gerar os arquivos
        if: steps.dia.outputs.rodar == 'sim'
        run: python3 pipeline/build_data.py --out site/data --cache .cache

      - name: Conferir o resultado
        if: steps.dia.outputs.rodar == 'sim'
        run: |
          python3 - <<'PY'
          import json, sys
          f = json.load(open('site/data/fundos.json'))['fundos']
          i = json.load(open('site/data/imoveis.json'))['props']
          print(len(f), 'fundos;', len(i), 'imóveis')
          if len(f) < 60 or len(i) < 300:
              sys.exit('Poucos dados: publicação cancelada.')
          PY

      - name: Guardar os dados no repositório
        if: steps.dia.outputs.rodar == 'sim'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)" || echo "Sem mudanças"
          git push

      - uses: actions/configure-pages@v5
        if: steps.dia.outputs.rodar == 'sim'

      - uses: actions/upload-pages-artifact@v3
        if: steps.dia.outputs.rodar == 'sim'
        with:
          path: site

      - uses: actions/deploy-pages@v4
        if: steps.dia.outputs.rodar == 'sim'
