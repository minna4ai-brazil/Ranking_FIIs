name: Atualizar dados

on:
  schedule:
    - cron: '37 11 * * 6'   # todo sábado 08:37 de Brasília; só roda de fato entre os dias 8 e 14
  workflow_dispatch: {}
  push:                     # republica o site quando as páginas mudam (sem baixar dados de novo)
    branches: [main]
    paths: ['site/**', '!site/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preparar
        id: prep
        run: |
          d=$(TZ=America/Sao_Paulo date +%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$d" -ge 8 ] && [ "$d" -le 14 ]; }; then rodar=sim; else rodar=nao; fi
          # funciona com os arquivos na raiz do repositório ou dentro da pasta fii-monitor
          if [ -f pipeline/build_data.py ]; then base=.; else base=$(dirname "$(dirname "$(find . -path '*/pipeline/build_data.py' | head -1)")"); fi
          echo "rodar=$rodar" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Dia $d, rodar=$rodar, pasta=$base"

      - uses: actions/setup-python@v5
        if: steps.prep.outputs.rodar == 'sim'
        with:
          python-version: '3.12'

      - name: Baixar dados e gerar arquivos
        if: steps.prep.outputs.rodar == 'sim'
        working-directory: ${{ steps.prep.outputs.base }}
        run: |
          python3 pipeline/build_data.py --out site/data --cache .cache
          python3 -c "import json,sys; f=json.load(open('site/data/fundos.json'))['fundos']; i=json.load(open('site/data/imoveis.json'))['props']; print(len(f),'fundos',len(i),'imoveis'); sys.exit(0 if len(f)>=60 and len(i)>=300 else 'Poucos dados: publicacao cancelada')"

      - name: Guardar os dados no repositório
        if: steps.prep.outputs.rodar == 'sim'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.prep.outputs.base }}/site/data"
          git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)" || echo "Sem mudanças"
          git push

      - uses: actions/configure-pages@v5
        if: steps.prep.outputs.rodar == 'sim' || github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v3
        if: steps.prep.outputs.rodar == 'sim' || github.event_name == 'push'
        with:
          path: ${{ steps.prep.outputs.base }}/site

      - uses: actions/deploy-pages@v4
        if: steps.prep.outputs.rodar == 'sim' || github.event_name == 'push'
